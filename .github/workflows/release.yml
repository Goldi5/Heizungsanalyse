name: Release

# Erstellt automatisch ein GitHub-Release, sobald sich die Version in der
# manifest.json ändert (Tag vX.Y.Z, Text aus CHANGELOG.md). Versionen mit bN
# oder rcN am Ende werden als Vorabversion veröffentlicht.
on:
  push:
    branches: [main]
    paths:
      - custom_components/heizungsanalyse/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version lesen
        id: v
        run: |
          VERSION=$(jq -r .version custom_components/heizungsanalyse/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if printf '%s' "$VERSION" | grep -Eq '(b|rc)[0-9]+$'; then
            echo "pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release schon vorhanden?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Text aus dem Changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" 'index($0, "## " v " ") == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Siehe CHANGELOG.md" > notes.md
          cat notes.md

      - name: Release erstellen
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.v.outputs.pre }}" = "true" ]; then
            gh release create "v${{ steps.v.outputs.version }}" --title "Heizungsanalyse v${{ steps.v.outputs.version }} (Beta)" \
              --notes-file notes.md --prerelease --latest=false --target "${{ github.sha }}"
          else
            gh release create "v${{ steps.v.outputs.version }}" --title "Heizungsanalyse v${{ steps.v.outputs.version }}" \
              --notes-file notes.md --target "${{ github.sha }}"
          fi
