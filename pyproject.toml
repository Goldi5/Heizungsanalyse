[tool.ruff]
target-version = "py313"
line-length = 130

[tool.ruff.lint]
select = ["F", "E9", "B", "I", "UP", "SIM", "ASYNC", "PLE", "RUF006", "RUF100", "BLE"]
ignore = [
    "SIM108",  # Ternary nicht erzwingen - oft schlechter lesbar
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "hz"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/heizungsanalyse"]

[tool.coverage.report]
show_missing = true
skip_covered = true
