update_inventory:
  name: Inventar aktualisieren
  description: >-
    Stammdaten eines Heizkreises, Thermostats oder der Hydraulik setzen. Jede
    echte Änderung wird automatisch im Änderungsverlauf protokolliert.
  fields:
    object:
      name: Objekt
      description: "Bereich und Bezeichner, z. B. pumps.hk2, thermostats.bad oder hydraulics."
      required: true
      selector:
        text:
    values:
      name: Werte
      description: Felder und neue Werte. Erlaubte Felder hängen vom Bereich ab.
      required: true
      selector:
        object:
    note:
      name: Notiz
      description: Optionaler Grund oder Hinweis zur Änderung.
      selector:
        text:

log_change:
  name: Änderung dokumentieren
  description: >-
    Freie Änderung am Inventar festhalten, ohne Stammdaten zu setzen. Für
    Vorher-Nachher-Vergleiche mit compare_periods.
  fields:
    object:
      name: Objekt
      required: true
      selector:
        text:
    field:
      name: Feld
      required: true
      selector:
        text:
    old_value:
      name: Alter Wert
      selector:
        text:
    new_value:
      name: Neuer Wert
      selector:
        text:
    note:
      name: Notiz
      selector:
        text:

compare_periods:
  name: Zeiträume vergleichen
  description: >-
    Kennzahlen vor und nach einem Stichtag vergleichen. Ohne change_time wird
    der letzte Eintrag im Änderungsverlauf genommen.
  fields:
    days:
      name: Fenstergröße
      description: Anzahl Tage vor und nach dem Stichtag.
      selector:
        number:
          min: 1
          max: 90
          mode: box
    change_time:
      name: Stichtag
      selector:
        datetime:

export_report:
  name: Bericht erzeugen
  description: Kennzahlen, Inventar und Änderungsverlauf als Markdown oder JSON.
  fields:
    format:
      name: Format
      selector:
        select:
          options:
            - markdown
            - json

refresh:
  name: Jetzt neu berechnen
  description: >-
    Wertet die vorhandenen Daten erneut aus. Die Integration liest dabei nur;
    es wird kein Gerät geschaltet.

export_plant_sheet:
  name: Anlagenblatt exportieren
  description: >-
    Erstellt ein Markdown-Anlagenblatt mit Pumpen, Heizkreisen, Räumen,
    Kennzahlen, Inventar, Schwellen und Hinweisen – zum Ausdrucken und
    Abgleichen beim hydraulischen Abgleich.
  fields: {}

suggest_heating_curve:
  name: Heizkurve vorschlagen
  description: >-
    Schlägt Heizkurven-Parameter (Offset, Steigung) aus der Vorlauf-Abweichung
    vor. Rein lesend – die Integration steuert nichts. Rückgabe enthält
    geschätzten COP-Gewinn und Konfidenz.
  fields: {}
